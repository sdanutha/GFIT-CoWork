name: Docker smoke

# Runtime smoke gate for a Team's Deployment: the deploy/ kit, built from this
# change's own Dockerfile and docker_init.bash.
#
# Background: v0.51.84 (PR #2470) shipped a startup-killing :ro mount + chown
# interaction (EROFS under `set -e`) that every source-level pytest invariant
# passed. Only `docker compose up` against a real Docker daemon catches that
# class of bug, so this workflow brings up the same kit every Deployment runs.
#
# Scope:
#   - `docker compose config` on deploy/docker-compose.yml with a generated
#     test .env (the example values, a random API key, a non-routable LDAP URL).
#   - Build the Dockerfile under the image name the kit expects
#     (gfit-cowork:latest) so the change's Dockerfile and init script execute.
#   - `up` the kit, probe /health on the published loopback port, and check
#     GFIT-CoWork answers only there and Hermes Agent's gateway is not published.
#   - Reaper before the run + trap on EXIT for orphan defence.
#
# The run never reaches a real AD: with the Directory configured the server
# starts and serves /health without contacting LDAP.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'Dockerfile'
      - 'docker_init.bash'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/docker-smoke.yml'
  push:
    branches: [main, dev]
    paths:
      - 'Dockerfile'
      - 'docker_init.bash'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch:

# Fork PRs run with no secrets — that's the right model. Pin to least privilege.
permissions:
  contents: read

jobs:
  compose-config:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the deploy kit with a generated test .env
        run: |
          set -euo pipefail
          DEPLOYMENT="$(mktemp -d -t gfit-smoke-config-XXXXXX)"
          cp deploy/docker-compose.yml "$DEPLOYMENT/"
          # The example values, a random API key and a non-routable (TEST-NET-1)
          # LDAP URL, exactly as an Admin would fill in team.env.example.
          sed \
            -e "s|^API_SERVER_KEY=.*|API_SERVER_KEY=$(openssl rand -hex 24)|" \
            -e "s|^HERMES_WEBUI_LDAP_URL=.*|HERMES_WEBUI_LDAP_URL=ldaps://192.0.2.1|" \
            deploy/team.env.example > "$DEPLOYMENT/.env"
          docker compose --project-directory "$DEPLOYMENT" config > /dev/null

  # Build the Docker image once and cache layers via GHA cache.
  # The smoke jobs then pull from this cache instead of rebuilding from scratch.
  build-image:
    name: Build Docker image (cache layers)
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gfit-cowork:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Startup-health gate for UID/GID auto-detection (#7027).
  #
  # The deploy kit mounts a named hermes-home volume, so it never exercises
  # the plain single-container shape from the issue: a state directory
  # bind-mounted from a host directory owned by a non-1024 user, /workspace left
  # as the image's own build-time 1024, and no explicit WANTED_UID/WANTED_GID.
  # Before the fix the auto-detector read /workspace, remapped to 1024, failed
  # its own state-dir writability check and restart-looped. Source-level
  # invariants can't catch that — only actually booting the container can.
  state-dir-uid:
    name: State-dir UID detection (#7027)
    runs-on: ubuntu-latest
    needs: [compose-config, build-image]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Restore Docker image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gfit-cowork:latest
          cache-from: type=gha

      - name: Boot on a host-owned state mount with no explicit IDs
        run: |
          set -euo pipefail

          CONTAINER="hermes-smoke-uid-${{ github.run_id }}-${{ github.run_attempt }}"
          HOST_UID=1001
          STATE_DIR="$(mktemp -d -t hermes-smoke-uidstate-XXXXXX)"
          sudo chown -R "$HOST_UID:$HOST_UID" "$STATE_DIR"

          cleanup() {
            local rc=$?
            echo "::group::Cleanup (rc=$rc)"
            docker logs "$CONTAINER" 2>&1 | tail -200 || true
            docker rm -f "$CONTAINER" || true
            sudo rm -rf "$STATE_DIR" || true
            echo "::endgroup::"
            return $rc
          }
          trap cleanup EXIT

          # Deliberately NOT mounting /workspace: the point of this gate is that
          # the stock image's own /workspace (owned 1024:1024) must not win over
          # the host-owned state mount.
          echo "::group::docker run"
          docker run -d --name "$CONTAINER" \
            -p 127.0.0.1:8788:8787 \
            -e HERMES_WEBUI_STATE_DIR=/app/data \
            -v "$STATE_DIR":/app/data \
            gfit-cowork:latest
          echo "::endgroup::"

          # ----- The product gate: the container must reach /health -----
          echo "::group::Probe /health"
          attempts=0
          max_attempts=60
          until curl --fail --silent --max-time 5 http://127.0.0.1:8788/health > /dev/null; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "❌ WebUI /health never returned 200 after $max_attempts attempts (~5m)"
              echo "   Startup logs follow in the cleanup group below."
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "❌ Container exited before /health came up — this is the #7027 restart loop"
              exit 1
            fi
            sleep 5
          done
          echo "✅ /health = 200 after $attempts attempts"
          echo "::endgroup::"

          echo "::group::Verify the detected identity"
          LOGS="$(docker logs "$CONTAINER" 2>&1)"

          # The identity must have been detected from the state dir, not /workspace.
          if ! echo "$LOGS" | grep -qE -- "-- Auto-detected UID: ${HOST_UID} \(from /app/data\)"; then
            echo "❌ UID was not auto-detected from the state directory (#7027)"
            echo "$LOGS" | grep -E -- "-- (Auto-detected|WANTED_)" || true
            exit 1
          fi
          if ! echo "$LOGS" | grep -qE -- "-- Auto-detected GID: ${HOST_UID} \(from /app/data\)"; then
            echo "❌ GID was not auto-detected from the state directory (#7027)"
            echo "$LOGS" | grep -E -- "-- (Auto-detected|WANTED_)" || true
            exit 1
          fi

          # And the runtime user must really carry it.
          ACTUAL_UID="$(docker exec "$CONTAINER" id -u hermeswebui)"
          ACTUAL_GID="$(docker exec "$CONTAINER" id -g hermeswebui)"
          if [ "$ACTUAL_UID" != "$HOST_UID" ] || [ "$ACTUAL_GID" != "$HOST_UID" ]; then
            echo "❌ hermeswebui runs as ${ACTUAL_UID}:${ACTUAL_GID}, expected ${HOST_UID}:${HOST_UID}"
            exit 1
          fi
          echo "✅ hermeswebui runs as ${ACTUAL_UID}:${ACTUAL_GID}, detected from the state mount"
          echo "::endgroup::"

          echo "::group::Startup log scan"
          BAD_PATTERNS='!! ERROR|!! Exiting script|Failed to verify state directory|Permission denied'
          if echo "$LOGS" | grep -E -i "$BAD_PATTERNS"; then
            echo "❌ Startup logs contain known-bad pattern (see above)"
            exit 1
          fi
          echo "✅ No known-bad patterns in startup logs"
          echo "::endgroup::"

      - name: Explicit WANTED_UID=1024 must survive auto-detection
        run: |
          set -euo pipefail

          CONTAINER="hermes-smoke-uid1024-${{ github.run_id }}-${{ github.run_attempt }}"
          STATE_DIR="$(mktemp -d -t hermes-smoke-uid1024-XXXXXX)"
          HERMES_DIR="$(mktemp -d -t hermes-smoke-uid1024home-XXXXXX)"
          # Both mounts are owned by a *different* UID than the one requested.
          # The hermes-home mount is what makes this discriminating: it is a
          # probe candidate the pre-fix script already read, so if the explicit
          # 1024 is still treated as "unset" the container remaps to 1001 and
          # the assertion below fails. World-writable state dir so the only
          # thing under test is which identity wins, not mount permissions.
          sudo chown -R 1001:1001 "$STATE_DIR" "$HERMES_DIR"
          sudo chmod 0777 "$STATE_DIR"

          cleanup() {
            local rc=$?
            echo "::group::Cleanup (rc=$rc)"
            docker logs "$CONTAINER" 2>&1 | tail -100 || true
            docker rm -f "$CONTAINER" || true
            sudo rm -rf "$STATE_DIR" "$HERMES_DIR" || true
            echo "::endgroup::"
            return $rc
          }
          trap cleanup EXIT

          docker run -d --name "$CONTAINER" \
            -p 127.0.0.1:8789:8787 \
            -e HERMES_WEBUI_STATE_DIR=/app/data \
            -e WANTED_UID=1024 \
            -e WANTED_GID=1024 \
            -v "$STATE_DIR":/app/data \
            -v "$HERMES_DIR":/home/hermeswebui/.hermes \
            gfit-cowork:latest

          attempts=0
          max_attempts=60
          until curl --fail --silent --max-time 5 http://127.0.0.1:8789/health > /dev/null; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "❌ WebUI /health never returned 200 with explicit WANTED_UID=1024"
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "❌ Container exited before /health came up"
              exit 1
            fi
            sleep 5
          done

          ACTUAL_UID="$(docker exec "$CONTAINER" id -u hermeswebui)"
          if [ "$ACTUAL_UID" != "1024" ]; then
            echo "❌ explicit WANTED_UID=1024 was overwritten by auto-detection — got ${ACTUAL_UID} (#7027)"
            exit 1
          fi
          echo "✅ explicit WANTED_UID=1024 preserved (sentinel no longer shadows the valid value)"

  smoke:
    name: Smoke deploy kit
    runs-on: ubuntu-latest
    needs: [compose-config, build-image]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Restore the cached Docker image from the build-image job.
      # Read-only: the build-image job already populated the GHA cache.
      - name: Restore Docker image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gfit-cowork:latest
          cache-from: type=gha

      - name: Reap any prior gfit-smoke resources on this runner
        run: |
          set -euo pipefail
          # Hosted GHA runners are fresh, so this is mostly defence-in-depth for
          # self-hosted runner re-use. The unique per-run Team name + `compose
          # down -v --remove-orphans` in the EXIT trap clean up what THIS run
          # creates; this step only sweeps leftovers from prior runs that
          # crashed before their trap fired. The kit names every container,
          # volume and network gfit-<TEAM>, so match by that prefix.
          for c in $(docker ps -aq --filter "name=gfit-smoke-"); do
            docker rm -f "$c" || true
          done
          for v in $(docker volume ls -q | grep "^gfit-smoke-" || true); do
            docker volume rm -f "$v" || true
          done
          for n in $(docker network ls --format '{{.Name}}' | grep "^gfit-smoke-" || true); do
            docker network rm "$n" || true
          done

      - name: Prepare the Deployment folder
        id: deployment
        run: |
          set -euo pipefail
          # Laid out as deploy/README.md tells an Admin to: the Compose file,
          # a filled-in .env next to it, and a certs folder.
          DEPLOYMENT="$(mktemp -d -t gfit-smoke-deployment-XXXXXX)"
          mkdir "$DEPLOYMENT/certs"
          cp deploy/docker-compose.yml "$DEPLOYMENT/"
          # Per-run Team name so concurrent jobs / reruns can't clobber each other.
          TEAM="smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          sed \
            -e "s|^TEAM=.*|TEAM=${TEAM}|" \
            -e "s|^API_SERVER_KEY=.*|API_SERVER_KEY=$(openssl rand -hex 24)|" \
            -e "s|^HERMES_WEBUI_LDAP_URL=.*|HERMES_WEBUI_LDAP_URL=ldaps://192.0.2.1|" \
            deploy/team.env.example > "$DEPLOYMENT/.env"
          GFIT_PORT="$(sed -n 's/^GFIT_PORT=//p' "$DEPLOYMENT/.env")"
          echo "dir=$DEPLOYMENT" >> "$GITHUB_OUTPUT"
          echo "port=$GFIT_PORT" >> "$GITHUB_OUTPUT"
          echo "Deployment gfit-${TEAM} in $DEPLOYMENT, published on 127.0.0.1:${GFIT_PORT}"

      - name: Smoke (up + health + loopback-only + log scan + down)
        env:
          DEPLOYMENT: ${{ steps.deployment.outputs.dir }}
          GFIT_PORT: ${{ steps.deployment.outputs.port }}
        run: |
          set -euo pipefail
          compose() { docker compose --project-directory "$DEPLOYMENT" "$@"; }

          # ----- Trap-guaranteed cleanup, regardless of exit reason -----
          cleanup() {
            local rc=$?
            echo "::group::Cleanup (rc=$rc)"
            compose logs --no-color --tail=200 || true
            compose down -v --remove-orphans || true
            rm -rf "$DEPLOYMENT" || true
            echo "::endgroup::"
            return $rc
          }
          trap cleanup EXIT

          echo "::group::docker compose up"
          # --wait blocks until all services report running/healthy OR
          # --wait-timeout fires. Compose v2 returns nonzero on either failure.
          compose up -d --wait --wait-timeout 180
          echo "::endgroup::"

          echo "::group::container roster"
          compose ps
          echo "::endgroup::"

          # ----- GFIT-CoWork /health on the published loopback port -----
          echo "::group::Probe /health"
          attempts=0
          max_attempts=30
          until curl --fail --silent --max-time 5 "http://127.0.0.1:${GFIT_PORT}/health" > /dev/null; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "❌ GFIT-CoWork /health never returned 200 after $max_attempts attempts (~60s)"
              exit 1
            fi
            sleep 2
          done
          echo "✅ /health = 200 on 127.0.0.1:${GFIT_PORT} after $attempts attempts"
          echo "::endgroup::"

          # ----- Reachable only through the reverse proxy -----
          echo "::group::Loopback-only publishing"
          PUBLISHED="$(compose port gfit-cowork 8787)"
          if [ "$PUBLISHED" != "127.0.0.1:${GFIT_PORT}" ]; then
            echo "❌ GFIT-CoWork is published on '$PUBLISHED', expected 127.0.0.1:${GFIT_PORT}"
            exit 1
          fi
          HOST_IP="$(hostname -I | awk '{print $1}')"
          if curl --silent --max-time 5 "http://${HOST_IP}:${GFIT_PORT}/health" > /dev/null; then
            echo "❌ GFIT-CoWork answers on the runner's address ${HOST_IP}:${GFIT_PORT}"
            exit 1
          fi
          AGENT_BINDINGS="$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$(compose ps -q hermes-agent)")"
          if [ "$AGENT_BINDINGS" != "{}" ] && [ "$AGENT_BINDINGS" != "null" ]; then
            echo "❌ Hermes Agent publishes ports on the host: $AGENT_BINDINGS"
            exit 1
          fi
          echo "✅ GFIT-CoWork answers only on 127.0.0.1:${GFIT_PORT}; Hermes Agent publishes nothing"
          echo "::endgroup::"

          # ----- Startup log scan: must not contain any known-bad signatures -----
          # These are the exact patterns that would have flagged #2470 in real time.
          echo "::group::Startup log scan"
          LOGS="$(compose logs --no-color gfit-cowork)"
          # `!! ERROR` + `!! Exiting script` are the actual strings emitted by
          # docker_init.bash's error_exit() helper — the function name itself
          # never appears in output. The literal token `error_exit` is kept as
          # a belt-and-suspenders catch for any stray debug/echo of the name.
          BAD_PATTERNS='EROFS|Read-only file system|Traceback|PermissionError|!! ERROR|!! Exiting script|error_exit|groupmod: cannot|usermod: cannot|Failed to set (UID|GID|owner|permissions|ownership)'
          if echo "$LOGS" | grep -E -i "$BAD_PATTERNS"; then
            echo "❌ Startup logs contain known-bad pattern (see above)"
            exit 1
          fi
          echo "✅ No known-bad patterns in startup logs"
          echo "::endgroup::"
