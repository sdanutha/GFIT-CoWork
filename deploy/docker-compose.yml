# GFIT-CoWork -- one Deployment for one Team: Hermes Agent, GFIT-CoWork and
# Hermes Agent's dashboard.
#
# Do not run this file with plain `docker compose`. Create a Deployment with
# deploy/new-deployment, then run it with deploy/cowork:
#
#   deploy/new-deployment sales 1
#   deploy/cowork sales up -d
#
# deploy/cowork uses deploy/deployments/<TEAM>/ as the project directory, so
# every relative path below (.env, ./home, ./workspace, ./certs) is inside that
# Deployment's own folder. Everything a Deployment keeps (Profiles, sessions,
# memory, the Profile roster, Workspaces) lives in ./home, so several
# Deployments share one server without touching each other. The step-by-step
# guide is deploy/README.md.

name: gfit-${TEAM:?set TEAM in .env}

services:
  hermes-agent:
    image: ${HERMES_AGENT_IMAGE:-nousresearch/hermes-agent:v0.21.6}
    command: gateway run
    env_file: .env
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_HOME_MODE=0750
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - HERMES_SKIP_CHMOD=1
      # The gateway API is reached by GFIT-CoWork over the Deployment's own
      # network only; it is never published on the host.
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY:?set API_SERVER_KEY in .env}
    volumes:
      - ./home:/home/hermes/.hermes
      - hermes-agent-src:/opt/hermes
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${AGENT_MEMORY_LIMIT:-2G}
          cpus: "2.0"

  gfit-cowork:
    # Built from the checkout deploy/cowork runs from, on every `up`.
    build:
      context: ${GFIT_COWORK_SRC:-../../..}
      dockerfile: Dockerfile
      args:
        HERMES_VERSION: stable
    image: ${GFIT_COWORK_IMAGE:-gfit-cowork:latest}
    pull_policy: build
    depends_on:
      - hermes-agent
    env_file: .env
    ports:
      # Loopback only: the reverse proxy (deploy/caddy) serves it over HTTPS.
      - "127.0.0.1:${GFIT_PORT:?set GFIT_PORT in .env}:8787"
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_HOME_MODE=0750
      - HERMES_API_URL=http://hermes-agent:8642
      - HERMES_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY}
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      # Only reachable through the HTTPS reverse proxy.
      - HERMES_WEBUI_SECURE=1
      - HERMES_WEBUI_ALLOWED_ORIGINS=https://${GFIT_HOSTNAME:?set GFIT_HOSTNAME in .env}
      # Count login attempts per person, not per proxy. The proxy reaches the
      # container from the Docker bridge network.
      - HERMES_WEBUI_TRUST_FORWARDED_FOR=1
      - HERMES_WEBUI_TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    volumes:
      - ./home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      # The server's default Workspace; no User works in it. A User's
      # Workspaces live in their Profile (./home).
      - ./workspace:/workspace
      # The AD CA certificate (HERMES_WEBUI_LDAP_CA_CERT=/certs/...).
      - ./certs:/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  hermes-dashboard:
    # Hermes Agent's own dashboard, for the Operator only. Loopback only and
    # never behind the reverse proxy: reach it over an SSH tunnel.
    image: ${HERMES_AGENT_IMAGE:-nousresearch/hermes-agent:v0.21.6}
    command: dashboard --host 0.0.0.0
    depends_on:
      - hermes-agent
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}:9119"
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_HOME_MODE=0750
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - GATEWAY_HEALTH_URL=http://hermes-agent:8642
      # Required: without it the image writes a random key into the shared
      # home/.env, which then replaces the gateway's key (loaded with
      # override=True) and GFIT-CoWork can no longer reach the gateway.
      - API_SERVER_KEY=${API_SERVER_KEY:?set API_SERVER_KEY in .env}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?set HERMES_DASHBOARD_BASIC_AUTH_USERNAME in .env}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set HERMES_DASHBOARD_BASIC_AUTH_PASSWORD in .env}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?set HERMES_DASHBOARD_BASIC_AUTH_SECRET in .env}
    volumes:
      - ./home:/home/hermes/.hermes
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  # Filled from the agent image on first start. After upgrading the agent
  # image, remove it so it is filled again (see deploy/README.md).
  hermes-agent-src:
